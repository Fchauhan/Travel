<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Registration</title>
    <title>Login</title>

    <style>
      body {
        font-family: "Open Sans", sans-serif;
      }

      /* Login Section */
      .login-section {
        min-height: 100vh;
        background-image: url("images/photos/s7.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-box {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 10px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }

      /* Small Navbar */
      .navbar {
        padding: 5px 0;
      }

      .nav-link {
        padding: 6px 12px;
        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light">
          <a class="navbar-brand" href="index.html">
            <img src="images/photos/images11.png" />
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-link">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  data-bs-toggle="dropdown"
                >
                  Tours
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="past-tours.html"
                      >Past Tours</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="future-tours.html"
                      >Future Tours</a
                    >
                  </li>
                </ul>
              </li>

              <li class="nav-item">
                <a class="nav-link active" href="login.html">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="registration.html">Registration</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">About Us</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <!-- Login Section -->
    <section class="login-section">
      <div class="login-box">
        <h2 class="text-center mb-4">Login</h2>

        <!-- Success Message -->
        <div id="successMsg" class="alert alert-success text-center d-none">
          ✅ Login successful!
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">Login</button>

          <p class="text-center mt-3">
            Don’t have an account?
            <a href="registration.html">Register here</a>
          </p>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3">
      <span class="mb-1">&copy; 2025 Travel. All Rights Reserved.</span>

      <a href="index.html" class="text-light text-decoration-none me-2">Home</a>
      |
      <a href="pasttours.html" class="text-light text-decoration-none me-2"
        >Past Tours</a
      >
      |
      <a href="futuretours.html" class="text-light text-decoration-none me-2"
        >Future Tours</a
      >
      |
      <a href="about.html" class="text-light text-decoration-none">About Us</a>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/custom.js "></script>
  </body>
</html>
